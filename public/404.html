<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Motus</title>
    <script>
      // Single-page app redirect for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/') {
          window.location.replace(l.pathname + l.hash);
        }
      }(window.location))
    </script>
  </head>
  <body></body>
</html>
