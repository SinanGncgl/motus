<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Motus</title>
  <script>
    // SPA redirect for GitHub Pages
    // When GitHub Pages serves 404.html, redirect to index.html with the path as a query param
    var repoPath = '/motus/';
    var path = window.location.pathname;
    if (path.indexOf(repoPath) === 0) {
      var subpath = path.slice(repoPath.length - 1); // keep leading /
      window.location.replace(repoPath + '?/' + subpath.replace(/^\//, '') + window.location.hash);
    } else {
      window.location.replace(repoPath);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
